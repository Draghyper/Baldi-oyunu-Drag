
name: RDP
on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      - name: Create RDP User
        shell: pwsh
        run: |
          $password = ([guid]::NewGuid().ToString("N") + "!Aa1")
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Pinggy
        shell: pwsh
        env:
          DEVICE_AGENT_TOKEN: ${{ secrets.DEVICE_AGENT_TOKEN }}
        run: |
          if (-not $env:DEVICE_AGENT_TOKEN) {
            throw "DEVICE_AGENT_TOKEN secret is missing"
          }
          irm https://pinggy.io/install.ps1 | iex

      - name: Start Pinggy RDP Tunnel
        shell: pwsh
        env:
          DEVICE_AGENT_TOKEN: ${{ secrets.DEVICE_AGENT_TOKEN }}
        run: |
          $process = Start-Process -FilePath "ssh.exe" `
            -ArgumentList @("-o", "StrictHostKeyChecking=no", "-p", "443", "-R", "0:localhost:3389", "t.pinggy.io") `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:TEMP\pinggy-out.txt" `
            -RedirectStandardError "$env:TEMP\pinggy-error.txt"

          Start-Sleep -Seconds 15

          Get-Content "$env:TEMP\pinggy-out.txt" -ErrorAction SilentlyContinue
          Get-Content "$env:TEMP\pinggy-error.txt" -ErrorAction SilentlyContinue

          if ($process.HasExited) {
            throw "Pinggy tunnel failed to start"
          }

      - name: Maintain RDP Connection
        shell: pwsh
        run: |
          Write-Host "RDP USER: RDP"
          Write-Host "RDP PASSWORD: $env:RDP_PASSWORD"
          while ($true) {
            Start-Sleep -Seconds 60
          }
